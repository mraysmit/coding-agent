<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX AI Rules Generator</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2d3148;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --code-bg: #131620;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        .form-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.data-input {
            min-height: 160px;
        }

        .field-group {
            margin-bottom: 1.25rem;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        .hint-input {
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .hint-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
        }

        /* Status/results area */
        #status-area {
            display: none;
        }

        .status-banner {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
            font-size: 0.92rem;
        }

        .status-running {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary-hover);
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .validation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .validation-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }

        .validation-chip:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.06);
        }

        .validation-chip.expanded {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .chip-expand-icon {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .validation-chip.expanded .chip-expand-icon {
            transform: rotate(180deg);
        }

        .chip-icon {
            font-size: 1rem;
        }

        .chip-pass { color: var(--success); }
        .chip-fail { color: var(--error); }
        .chip-unknown { color: var(--text-muted); }

        .stage-detail-panel {
            display: none;
            grid-column: 1 / -1;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: -0.25rem;
            animation: slideDown 0.2s ease-out;
        }

        .stage-detail-panel.visible {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stage-detail-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stage-detail-header .status-badge {
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-badge.pass {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-badge.fail {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .stage-detail-content {
            font-size: 0.82rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            max-height: 400px;
            overflow-y: auto;
            word-break: break-word;
        }

        .stage-detail-content .detail-status-line {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .stage-detail-content .detail-json {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            margin-top: 0.25rem;
            overflow-x: auto;
        }

        .stage-detail-content .detail-section-label {
            color: var(--primary);
            font-weight: 600;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
            font-size: 0.85rem;
        }

        .summary-text {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 1rem;
            white-space: pre-wrap;
        }

        .file-card {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            overflow: hidden;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background: rgba(99, 102, 241, 0.06);
            border-bottom: 1px solid var(--border);
        }

        .file-name {
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-hover);
        }

        .file-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--surface);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .file-content {
            padding: 0.75rem 1rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.82rem;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .result-section {
            margin-bottom: 1.25rem;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        /* Sample data button */
        .sample-link {
            font-size: 0.8rem;
            color: var(--primary);
            cursor: pointer;
            float: right;
            margin-top: -1.8rem;
        }

        .sample-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Rule Results Table */
        .rule-results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .rule-results-table th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            background: rgba(99, 102, 241, 0.08);
            color: var(--primary-hover);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        .rule-results-table td {
            padding: 0.45rem 0.75rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .rule-results-table tr:last-child td {
            border-bottom: none;
        }

        .rule-results-table tr:hover td {
            background: rgba(99, 102, 241, 0.04);
        }

        .rule-result-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
        }

        .rule-result-badge.match {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .rule-result-badge.no-match {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-muted);
        }

        .rule-result-badge.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .rule-results-wrapper {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            max-height: 500px;
            overflow-y: auto;
        }

        .rule-results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .rule-results-summary {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .execution-run-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary-hover);
            padding: 0.4rem 0.75rem;
            background: rgba(99, 102, 241, 0.06);
            border-bottom: 1px solid var(--border);
        }

        .severity-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
        }

        .severity-badge.info { background: rgba(99, 102, 241, 0.12); color: var(--primary-hover); }
        .severity-badge.warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .severity-badge.error { background: rgba(239, 68, 68, 0.12); color: var(--error); }
        .severity-badge.critical { background: rgba(239, 68, 68, 0.2); color: var(--error); }

        .toggle-link {
            font-size: 0.8rem;
            color: var(--primary);
            cursor: pointer;
        }

        .toggle-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>APEX Rules Generator</h1>
            <p>Generate validated APEX YAML business rules from natural language requirements</p>
        </header>

        <!-- Input Form -->
        <div class="form-section">
            <div class="field-group">
                <label for="requirements">Business Requirements</label>
                <textarea id="requirements" placeholder="Describe the business rules you want to generate...&#10;&#10;Example: Create a loan eligibility rule. Applicants must be at least 18 years old, have a credit score above 650, and annual income exceeding $30,000. If all conditions are met, the applicant is eligible for a standard loan."></textarea>
            </div>

            <div class="field-group">
                <label for="dataStructure">JSON Data Structure
                    <span class="sample-link" onclick="loadSample()">Load sample</span>
                </label>
                <textarea id="dataStructure" class="data-input" placeholder='Describe or paste the JSON structure your rules will evaluate...&#10;&#10;Example:&#10;{&#10;  "applicantAge": 25,&#10;  "creditScore": 720,&#10;  "annualIncome": 55000,&#10;  "existingLoans": 1&#10;}'></textarea>
            </div>

            <div class="field-group">
                <label for="hints">Hints (optional, comma-separated)</label>
                <input class="hint-input" id="hints" type="text" placeholder="e.g., eligibility, classification, score-based" />
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="generateBtn" onclick="submitGeneration()">
                Generate Rules
            </button>
            <button class="btn-secondary" onclick="clearForm()">Clear</button>
        </div>

        <!-- Results Area -->
        <div id="status-area">
            <div id="status-banner" class="status-banner status-running">
                <div class="spinner" id="status-spinner"></div>
                <span id="status-text">Generating...</span>
            </div>

            <div id="results-container" style="display:none;">
                <!-- Validation -->
                <div class="result-section">
                    <div class="section-title">Validation Results</div>
                    <div class="validation-grid" id="validation-grid"></div>
                </div>

                <!-- Rule Execution Results -->
                <div class="result-section" id="rule-results-section" style="display:none;">
                    <div class="section-title">Rule Execution Results</div>
                    <div id="rule-results-container"></div>
                </div>

                <!-- Summary -->
                <div class="result-section" id="summary-section" style="display:none;">
                    <div class="section-title">Summary</div>
                    <div class="summary-text" id="summary-text"></div>
                </div>

                <!-- Generated Files -->
                <div class="result-section" id="files-section" style="display:none;">
                    <div class="section-title">Generated Files</div>
                    <div id="files-container"></div>
                </div>

                <!-- Output Directory -->
                <div class="result-section" id="output-dir-section" style="display:none;">
                    <div class="section-title">Output Directory</div>
                    <div class="summary-text" id="output-dir-text" style="font-family: monospace; font-size: 0.85rem;"></div>
                </div>
            </div>
        </div>

        <footer>
            APEX Rules Generator &middot; Powered by Spring AI + GPT-4o
        </footer>
    </div>

    <script>
        let currentJobId = null;
        let pollInterval = null;

        function loadSample() {
            document.getElementById('requirements').value =
                'Create an order discount rule. Orders over $100 get a 10% discount. ' +
                'Orders over $500 get a 20% discount. VIP customers always get at least 15% discount. ' +
                'The rule should evaluate the order total and customer tier.';
            document.getElementById('dataStructure').value = JSON.stringify({
                orderTotal: 250.00,
                customerTier: "VIP",
                itemCount: 5,
                isReturningCustomer: true
            }, null, 2);
            document.getElementById('hints').value = 'discount, tiered, classification';
        }

        function clearForm() {
            document.getElementById('requirements').value = '';
            document.getElementById('dataStructure').value = '';
            document.getElementById('hints').value = '';
            document.getElementById('status-area').style.display = 'none';
            document.getElementById('results-container').style.display = 'none';
            currentJobId = null;
            if (pollInterval) clearInterval(pollInterval);
        }

        async function submitGeneration() {
            const requirements = document.getElementById('requirements').value.trim();
            const dataStructure = document.getElementById('dataStructure').value.trim();
            const hints = document.getElementById('hints').value.trim();

            if (!requirements) {
                alert('Please enter business requirements.');
                return;
            }
            if (!dataStructure) {
                alert('Please enter a JSON data structure.');
                return;
            }

            // Reset UI
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = 'Generating...';

            document.getElementById('status-area').style.display = 'block';
            document.getElementById('results-container').style.display = 'none';

            const banner = document.getElementById('status-banner');
            banner.className = 'status-banner status-running';
            document.getElementById('status-spinner').style.display = 'block';
            document.getElementById('status-text').textContent = 'Submitting generation request...';

            try {
                const response = await fetch('/api/apex/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requirements, dataStructure, hints })
                });

                const data = await response.json();
                currentJobId = data.jobId;
                document.getElementById('status-text').textContent =
                    `Generation in progress (Job: ${currentJobId.substring(0, 20)}...)`;

                // Start polling
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollStatus, 3000);
            } catch (err) {
                showError('Failed to submit request: ' + err.message);
            }
        }

        async function pollStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/apex/status/${currentJobId}`);
                if (!response.ok) {
                    showError('Job not found');
                    return;
                }

                const data = await response.json();

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    showResults(data);
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    showError(data.error || 'Generation failed');
                }
                // else still running, keep polling
            } catch (err) {
                // Network error, keep trying
                console.warn('Poll error:', err);
            }
        }

        function showError(message) {
            const banner = document.getElementById('status-banner');
            banner.className = 'status-banner status-failed';
            document.getElementById('status-spinner').style.display = 'none';
            document.getElementById('status-text').textContent = 'Failed: ' + message;

            const btn = document.getElementById('generateBtn');
            btn.disabled = false;
            btn.textContent = 'Generate Rules';
        }

        function showResults(data) {
            const banner = document.getElementById('status-banner');
            document.getElementById('status-spinner').style.display = 'none';

            if (data.success) {
                banner.className = 'status-banner status-completed';
                document.getElementById('status-text').textContent =
                    `Generation successful (${data.attempts} attempt${data.attempts > 1 ? 's' : ''})`;
            } else {
                banner.className = 'status-banner status-failed';
                document.getElementById('status-text').textContent =
                    `Generation completed but validation failed after ${data.attempts} attempt(s)`;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = false;
            btn.textContent = 'Generate Rules';

            // Validation grid
            const grid = document.getElementById('validation-grid');
            const report = data.validationReport || {};
            const stageDetails = report.stageDetails || {};
            grid.innerHTML = '';
            const checks = [
                ['Lexical', report.lexicalValid, 'lexical'],
                ['Compilation', report.compilationSuccess, 'compilation'],
                ['Execution', report.executionSuccess, 'execution'],
                ['Expectations', report.expectationsPass, 'expectation']
            ];
            for (const [name, val, key] of checks) {
                const cls = val === true ? 'chip-pass' : val === false ? 'chip-fail' : 'chip-unknown';
                const icon = val === true ? '✓' : val === false ? '✗' : '—';
                const detail = stageDetails[key] || {};
                const detailText = detail.detail || '';
                const formattedDetail = formatStageDetail(detailText, name, val);
                const statusLabel = val === true ? 'PASS' : val === false ? 'FAIL' : 'UNKNOWN';
                const statusCls = val === true ? 'pass' : 'fail';
                const panelId = `stage-panel-${key}`;

                grid.innerHTML += `
                    <div class="validation-chip" onclick="toggleStageDetail('${key}')" id="chip-${key}">
                        <span class="chip-icon ${cls}">${icon}</span>
                        <span>${name}</span>
                        <span class="chip-expand-icon">▼</span>
                    </div>`;

                // Create the detail panel (inserted after the grid via a separate container)
                const panelHtml = `
                    <div class="stage-detail-panel" id="${panelId}">
                        <div class="stage-detail-header">
                            <span>${name}</span>
                            <span class="status-badge ${statusCls}">${statusLabel}</span>
                        </div>
                        <div class="stage-detail-content">${formattedDetail}</div>
                    </div>`;

                // Store for after grid render
                if (!window._stagePanels) window._stagePanels = '';
                window._stagePanels += panelHtml;
            }

            // Insert stage detail panels after the grid
            let panelsContainer = document.getElementById('stage-panels-container');
            if (!panelsContainer) {
                panelsContainer = document.createElement('div');
                panelsContainer.id = 'stage-panels-container';
                grid.parentNode.insertBefore(panelsContainer, grid.nextSibling);
            }
            panelsContainer.innerHTML = window._stagePanels || '';
            window._stagePanels = '';

            // Summary
            if (data.summary) {
                document.getElementById('summary-section').style.display = 'block';
                document.getElementById('summary-text').textContent = data.summary;
            }

            // Rule Execution Results
            renderRuleResults(report.ruleResults || []);

            // Files
            const filesContainer = document.getElementById('files-container');
            filesContainer.innerHTML = '';
            if (data.files && data.files.length > 0) {
                document.getElementById('files-section').style.display = 'block';
                for (const file of data.files) {
                    filesContainer.innerHTML += `
                        <div class="file-card">
                            <div class="file-header">
                                <span class="file-name">${escapeHtml(file.fileName)}</span>
                                <span class="file-type">${escapeHtml(file.docType || 'yaml')}</span>
                            </div>
                            <div class="file-content">${escapeHtml(file.content)}</div>
                        </div>`;
                }
            }

            // Output directory
            if (data.outputDirectory) {
                document.getElementById('output-dir-section').style.display = 'block';
                document.getElementById('output-dir-text').textContent = data.outputDirectory;
            }

            document.getElementById('results-container').style.display = 'block';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatStageDetail(rawText, stageName, passed) {
            if (!rawText || rawText.trim() === '') {
                return `<div class="detail-status-line">${escapeHtml(stageName)}: ${passed ? 'PASS' : 'FAIL'}</div><div>No detailed output available for this stage.</div>`;
            }

            // Try to find and format JSON blocks within the text
            const parts = [];
            let remaining = rawText;

            // Extract "Status: PASS/FAIL" line if present
            const statusMatch = remaining.match(/^Status:\s*(PASS|FAIL)\s*$/m);
            if (statusMatch) {
                const statusColor = statusMatch[1] === 'PASS' ? 'var(--success)' : 'var(--error)';
                parts.push(`<div class="detail-status-line" style="color: ${statusColor}">Status: ${statusMatch[1]}</div>`);
                remaining = remaining.replace(statusMatch[0], '').trim();
            }

            // Try to find JSON blocks (objects or arrays) in the remaining text
            const jsonRegex = /(\{[\s\S]*?\}(?=\s*$|\s*\n[^{\s]|\s*\n\s*$)|\[[\s\S]*?\](?=\s*$|\s*\n[^[\s]|\s*\n\s*$))/g;
            let hasJson = false;

            // Split into lines and process
            const lines = remaining.split('\n');
            let currentText = [];
            let inJson = false;
            let jsonBuffer = '';
            let braceCount = 0;

            for (const line of lines) {
                const trimmed = line.trim();

                if (!inJson && (trimmed.startsWith('{') || trimmed.startsWith('['))) {
                    // Flush any accumulated text
                    if (currentText.length > 0) {
                        parts.push(`<div>${escapeHtml(currentText.join('\n'))}</div>`);
                        currentText = [];
                    }
                    inJson = true;
                    jsonBuffer = '';
                    braceCount = 0;
                }

                if (inJson) {
                    jsonBuffer += (jsonBuffer ? '\n' : '') + line;
                    for (const ch of trimmed) {
                        if (ch === '{' || ch === '[') braceCount++;
                        if (ch === '}' || ch === ']') braceCount--;
                    }
                    if (braceCount <= 0) {
                        inJson = false;
                        try {
                            const parsed = JSON.parse(jsonBuffer);
                            const formatted = JSON.stringify(parsed, null, 2);
                            parts.push(`<div class="detail-json">${escapeHtml(formatted)}</div>`);
                            hasJson = true;
                        } catch {
                            // Not valid JSON, render as text
                            parts.push(`<div>${escapeHtml(jsonBuffer)}</div>`);
                        }
                        jsonBuffer = '';
                    }
                } else {
                    currentText.push(line);
                }
            }

            // Flush remaining text or json buffer
            if (jsonBuffer) {
                parts.push(`<div>${escapeHtml(jsonBuffer)}</div>`);
            }
            if (currentText.length > 0) {
                const text = currentText.join('\n').trim();
                if (text) {
                    parts.push(`<div>${escapeHtml(text)}</div>`);
                }
            }

            return parts.join('') || `<div>${escapeHtml(rawText)}</div>`;
        }

        function renderRuleResults(ruleResults) {
            const section = document.getElementById('rule-results-section');
            const container = document.getElementById('rule-results-container');

            if (!ruleResults || ruleResults.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';

            for (let runIdx = 0; runIdx < ruleResults.length; runIdx++) {
                const run = ruleResults[runIdx];
                const children = run.childResults || [];
                const overallSuccess = run.success === true;
                const resultType = run.resultType || 'UNKNOWN';
                const failureMessages = run.failureMessages || [];

                let html = '<div class="rule-results-wrapper" style="margin-bottom: 0.75rem;">';

                // Run header
                const runLabel = ruleResults.length > 1
                    ? `Execution Run ${runIdx + 1} of ${ruleResults.length}`
                    : 'Execution Run';
                const overallBadge = overallSuccess
                    ? '<span class="rule-result-badge match">PASS</span>'
                    : '<span class="rule-result-badge error">FAIL</span>';
                html += `<div class="execution-run-label">${escapeHtml(runLabel)} &nbsp; ${overallBadge} &nbsp; <span style="color: var(--text-muted); font-weight: 400;">Result: ${escapeHtml(resultType)}</span></div>`;

                if (children.length > 0) {
                    html += '<table class="rule-results-table">';
                    html += '<thead><tr>';
                    html += '<th>Rule</th><th>Result</th><th>Triggered</th><th>Severity</th><th>Message</th>';
                    html += '</tr></thead><tbody>';

                    for (const child of children) {
                        const rName = child.ruleName || child.ruleId || '\u2014';
                        const rType = (child.resultType || 'UNKNOWN').toUpperCase();
                        const rTriggered = child.triggered === true;
                        const severity = (child.severity || 'INFO').toUpperCase();
                        const message = child.message || '';
                        const childFailures = child.failureMessages || [];

                        // Result type badge class
                        let resultCls = 'no-match';
                        if (rType === 'MATCH') resultCls = 'match';
                        else if (rType === 'ERROR' || rType === 'ENRICHMENT_FAILURE') resultCls = 'error';

                        // Severity badge class
                        let sevCls = 'info';
                        if (severity === 'WARNING' || severity === 'WARN') sevCls = 'warn';
                        else if (severity === 'ERROR') sevCls = 'error';
                        else if (severity === 'CRITICAL') sevCls = 'critical';

                        // Triggered indicator
                        const triggeredIcon = rTriggered
                            ? '<span style="color: var(--success);">&#x2713;</span>'
                            : '<span style="color: var(--text-muted);">&#x2013;</span>';

                        // Combine message + failure messages
                        let msgText = message;
                        if (childFailures.length > 0) {
                            msgText = msgText
                                ? msgText + ' | ' + childFailures.join('; ')
                                : childFailures.join('; ');
                        }

                        html += '<tr>';
                        html += `<td style="font-weight: 500;">${escapeHtml(rName)}</td>`;
                        html += `<td><span class="rule-result-badge ${resultCls}">${escapeHtml(rType)}</span></td>`;
                        html += `<td style="text-align: center;">${triggeredIcon}</td>`;
                        html += `<td><span class="severity-badge ${sevCls}">${escapeHtml(severity)}</span></td>`;
                        html += `<td style="color: var(--text-muted); font-size: 0.78rem;">${escapeHtml(msgText || '\u2014')}</td>`;
                        html += '</tr>';
                    }

                    html += '</tbody></table>';
                } else {
                    // No child results - show top-level info
                    html += '<div style="padding: 0.75rem; font-size: 0.82rem;">';
                    html += `<div>Overall: ${overallSuccess ? 'PASS' : 'FAIL'} (${escapeHtml(resultType)})</div>`;
                    if (failureMessages.length > 0) {
                        html += '<div style="color: var(--error); margin-top: 0.25rem;">'
                            + escapeHtml(failureMessages.join('; ')) + '</div>';
                    }
                    html += '</div>';
                }

                html += '</div>';
                container.innerHTML += html;
            }

            // Summary line
            const totalRuns = ruleResults.length;
            const passedRuns = ruleResults.filter(r => r.success === true).length;
            const summaryEl = document.createElement('div');
            summaryEl.className = 'rule-results-summary';
            summaryEl.textContent = `${totalRuns} execution run${totalRuns > 1 ? 's' : ''}, ${passedRuns} passed`;
            container.insertBefore(summaryEl, container.firstChild);
        }

        function toggleStageDetail(stageKey) {
            const panel = document.getElementById(`stage-panel-${stageKey}`);
            const chip = document.getElementById(`chip-${stageKey}`);
            if (!panel) return;

            const isVisible = panel.classList.contains('visible');

            // Close all panels first
            document.querySelectorAll('.stage-detail-panel').forEach(p => p.classList.remove('visible'));
            document.querySelectorAll('.validation-chip').forEach(c => c.classList.remove('expanded'));

            // Toggle the clicked one (if it wasn't already open)
            if (!isVisible) {
                panel.classList.add('visible');
                if (chip) chip.classList.add('expanded');
            }
        }
    </script>
</body>
