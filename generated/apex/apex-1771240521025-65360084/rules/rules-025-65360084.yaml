metadata:
  id: "order-discount-rule-config"
  name: "Order Discount Rule Config"
  version: "1.0"
  description: "Defines discount rules based on order total and customer tier."
  type: "rule-config"
  author: "Generated by System"

rules:
  - id: "discount-over-100"
    name: "10% Discount for Orders Over $100"
    condition: "#orderTotal > 100 and #orderTotal <= 500"
    message: "Order qualifies for a 10% discount."
    severity: "INFO"
   
  - id: "discount-over-500"
    name: "20% Discount for Orders Over $500"
    condition: "#orderTotal > 500"
    message: "Order qualifies for a 20% discount."
    severity: "INFO"

  - id: "vip-discount"
    name: "VIP Customer Discount"
    condition: "#customerTier == 'VIP'"
    message: "VIP customer receives at least a 15% discount."
    severity: "INFO"

enrichments: []