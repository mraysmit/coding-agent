metadata:
  id: "discount-tiers"
  name: "Order Discount Rules"
  version: "1.0"
  description: "Rules for applying discounts based on order total and customer tier."
  type: "rule-config"
  author: "Generated by APEX Coding Agent"

rules:
  - id: "rule-high-discount"
    name: "High Discount Rule"
    condition: "#orderTotal > 500"
    message: "Apply a 20% discount for orders over $500."
    severity: "INFO"

  - id: "rule-medium-discount"
    name: "Medium Discount Rule"
    condition: "#orderTotal > 100 && #orderTotal <= 500"
    message: "Apply a 10% discount for orders over $100."
    severity: "INFO"

  - id: "rule-vip-discount"
    name: "VIP Discount Rule"
    condition: "#customerTier.equals('VIP')"
    message: "VIP customer receives at least 15% discount."
    severity: "INFO"
